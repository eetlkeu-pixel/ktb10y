<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>국고채 10년 내러티브 계산기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 열. 범위 요약 → 범위 차트 → 내러티브 표 → 구성요소 → 반사성 지표 */
:root{
  --bg:#f3f5f8;--surface:#fff;--sunk:#eef1f5;--ink:#0f1620;--ink2:#465061;--muted:#7f8896;--line:#dde2e9;--axis:#bcc4cf;
  --accent:#0d6e66;--accent-soft:#d8efec;--up:#c8323a;--up-soft:#fbe6e7;--down:#2364c4;--down-soft:#e2ecfb;--warn:#b26a00;--warn-soft:#fdf0d9;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1116;--surface:#161b22;--sunk:#1c222b;--ink:#e7ebf0;--ink2:#a9b2bf;--muted:#7c8594;--line:#29303a;--axis:#3a434f;
  --accent:#35b5a8;--accent-soft:#143a37;--up:#ef6b6b;--up-soft:#3a1d20;--down:#5b9bf0;--down-soft:#17283f;--warn:#e3a33a;--warn-soft:#352a14;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1116;--surface:#161b22;--sunk:#1c222b;--ink:#e7ebf0;--ink2:#a9b2bf;--muted:#7c8594;--line:#29303a;--axis:#3a434f;
  --accent:#35b5a8;--accent-soft:#143a37;--up:#ef6b6b;--up-soft:#3a1d20;--down:#5b9bf0;--down-soft:#17283f;--warn:#e3a33a;--warn-soft:#352a14;color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.num,input,td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px}
h1{font-size:22px;margin:0;font-weight:700}
.meta{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tile{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.tile .k{font-size:12px;color:var(--muted)} .tile .v{font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.2} .tile .d{font-size:12px;color:var(--ink2)}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
h2 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.up{color:var(--up)} .down{color:var(--down)}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
th{font-size:11.5px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--axis)}
th:first-child,td:first-child{text-align:left}
td.nm{white-space:normal;min-width:220px}
td.nm b{display:block;font-weight:600}
td.nm span{display:block;font-size:12px;color:var(--ink2)}
td.st{text-align:left;white-space:normal;min-width:180px;font-size:12px;color:var(--ink2)}
input[type=number]{width:66px;font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--sunk);color:var(--ink);text-align:right}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
tr.tot td{font-weight:600;background:var(--sunk);border-top:1px solid var(--axis)}
.comp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.comp label{display:grid;gap:3px;font-size:12px;color:var(--ink2)}
.comp input{width:100%}
.out{margin-top:12px;font-size:13px;color:var(--ink2)}
.out b{color:var(--ink);font-family:var(--f-num)}
.chip{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:4px;font-family:var(--f-body)}
.chip.on{background:var(--warn-soft);color:var(--warn)} .chip.off{background:var(--sunk);color:var(--muted)} .chip.na{border:1px dashed var(--axis);color:var(--muted)}
.chart{position:relative} .chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--f-num);font-size:11px;fill:var(--muted)} .chart text.lab{font-family:var(--f-body);fill:var(--ink2);font-size:12px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12);border-radius:6px;padding:7px 9px;font-size:12px;min-width:160px;z-index:5}
.tip .r{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-num)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:12.5px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--ink2);cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
.foot{font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>국고채 10년 내러티브 계산기</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div class="tiles" id="tiles"></div>

  <section>
    <h2>내러티브별 도달 범위 <small>점: 적정금리 · 선 끝: 포지션 오버슈팅 극단</small></h2>
    <div class="legend"><span><i style="border-color:var(--ink)"></i>현재</span><span><i style="border-color:var(--accent);border-top-style:dashed"></i>확률가중</span><span><i style="border-color:var(--axis);border-top-style:dotted"></i>붐 이전 저점 · 고점</span></div>
    <div class="chart" id="range"></div>
  </section>

  <section>
    <h2>내러티브 → 넘버 <small>기준 대비 변화 · %p</small></h2>
    <div class="tscroll"><table id="nar"></table></div>
  </section>

  <section>
    <h2>10년물 구성요소 <small>현재 기준</small></h2>
    <div class="comp" id="comp"></div>
    <div class="out" id="compOut"></div>
  </section>

  <section>
    <h2>반사성 <small>m = 1 / (1 + β·φ − ψ)</small></h2>
    <div class="comp" id="refl"></div>
    <div class="out" id="reflOut"></div>
    <div class="tscroll" style="margin-top:12px"><table id="ind"></table></div>
  </section>

  <div class="bar">
    <button type="button" id="copy">설정 JSON 복사</button>
    <button type="button" id="reset">기본값 복원</button>
    <span class="foot" id="msg"></span>
  </div>
  <p class="foot">10년 ≈ π̄ + r̄* + TP + @. r̄* 변화 = β·Δg·min(H,10)/10. 적정 = 현재 + m·Δ, 극단 = 현재 + m·Δ·(1+κ). 편집 내용은 이 브라우저에만 저장된다.</p>
</div>

<script type="application/json" id="data">
{
  "asof": "2026-11-04",
  "market": { "y10": 4.001, "y3": 3.736, "pre": 2.95, "peak": 4.60 },
  "base": { "pi": 2.35, "g": 2.20, "rs": 0.55, "beta": 0.45, "tp": 0.95, "at": 0.15 },

    { "id": "base", "name": "현 전제 유지", "story": "성장 서사와 수급이 지금 가격 그대로", "p": 25, "dpi": 0, "dg": 0, "H": 10, "dtp": 0, "dat": 0 },

<script>
(function(){
const DEF=JSON.parse(document.getElementById('data').textContent);
const KEY='ktb10y-narr-'+DEF.asof;
let D;
try{const r=localStorage.getItem(KEY);D=r?JSON.parse(r):null;}catch(e){}
if(!D||!D.narratives)D=JSON.parse(JSON.stringify(DEF));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=x=>isFinite(x)?x.toFixed(2)+'%':'–';
const bp=x=>{if(!isFinite(x))return'–';const v=Math.round(x*100);return(v>0?'+':v<0?'−':'±')+Math.abs(v)+'bp';};
const cls=x=>x>0.0049?'up':x<-0.0049?'down':'';
const num=(v,step,attrs)=>`<input type="number" step="${step}" value="${v==null?'':v}" ${attrs}>`;

function M(){const d=1+D.base.beta*D.reflex.phi-D.reflex.psi;return{den:d,m:d>0.02?1/d:Infinity};}
function evalN(n){const b=D.base,{m}=M(),y=D.market.y10;
  const dr=b.beta*n.dg*Math.min(Math.max(n.H,0),10)/10,d=n.dpi+dr+n.dtp+n.dat;
  return{dr,d,fair:y+m*d,over:y+m*d*(1+D.reflex.kappa/100)};}
function stats(){const E=D.narratives.map(evalN);let sp=0,sv=0;
  D.narratives.forEach((n,i)=>{sp+=+n.p||0;sv+=(+n.p||0)*E[i].fair;});
  const all=E.flatMap(e=>[e.fair,e.over]);
  return{E,sp,ev:sp?sv/sp:NaN,hi:Math.max(...all),lo:Math.min(...all)};}
function fwd(){const m=D.market;return(10*m.y10-3*m.y3)/7;}

/* builders (inputs persist across renders) */
function buildNar(){
  let h='<thead><tr><th>내러티브</th><th>확률%</th><th>Δπ̄</th><th>Δg</th><th>H년</th><th>ΔTP</th><th>Δ@</th><th>Δr̄*</th><th>펀더멘털 Δ</th><th>적정</th><th>극단</th></tr></thead><tbody>';
  D.narratives.forEach((n,i)=>{
    h+=`<tr><td class="nm"><b>${esc(n.name)}</b><span>${esc(n.story)}</span></td>`+
      ['p','dpi','dg','H','dtp','dat'].map(k=>`<td class="n">${num(n[k],k==='p'||k==='H'?1:0.05,`data-i="${i}" data-k="${k}" aria-label="${esc(n.name)} ${k}"`)}</td>`).join('')+
      `<td class="n" id="r${i}"></td><td class="n" id="d${i}"></td><td class="n" id="f${i}"></td><td class="n" id="o${i}"></td></tr>`;});
  h+='<tr class="tot"><td>확률가중</td><td class="n" id="sp"></td><td colspan="6"></td><td class="n" id="evd"></td><td class="n" id="ev"></td><td></td></tr></tbody>';
  $('nar').innerHTML=h;
  $('nar').querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{const v=parseFloat(el.value);if(!isFinite(v))return;D.narratives[+el.dataset.i][el.dataset.k]=v;save();render();}));
}
const COMP=[['market','y10','시장 10년 %',0.01],['market','y3','시장 3년 %',0.01],['base','pi','기대인플레 π̄',0.05],['base','g','반영 잠재성장 g',0.1],['base','rs','실질중립 r̄*',0.05],['base','beta','β (g→r*)',0.05],['base','tp','텀프리미엄 TP',0.05],['base','at','@ 정책괴리·잔차',0.01],['market','pre','붐 이전 저점',0.01],['market','peak','붐 고점',0.01]];
const REFL=[['phi','φ 금리→성장',0.05],['psi','ψ 금리→TP',0.05],['kappa','κ 오버슈팅 %',5]];
function buildFields(){
  $('comp').innerHTML=COMP.map(([g,k,l,s])=>`<label>${l}${num(D[g][k],s,`data-g="${g}" data-k="${k}"`)}</label>`).join('');
  $('refl').innerHTML=REFL.map(([k,l,s])=>`<label>${l}${num(D.reflex[k],s,`data-g="reflex" data-k="${k}"`)}</label>`).join('');
  document.querySelectorAll('#comp input,#refl input').forEach(el=>el.addEventListener('input',()=>{const v=parseFloat(el.value);if(!isFinite(v))return;D[el.dataset.g][el.dataset.k]=v;save();render();}));
}
function buildInd(){
  let h='<thead><tr><th>지표</th><th>고리</th><th>현재값</th><th>발동 조건</th><th>발동 시</th><th>상태</th><th style="text-align:left">메모</th></tr></thead><tbody>';
  D.indicators.forEach((x,i)=>{const auto=x.value==='auto';
    h+=`<tr><td>${esc(x.name)}</td><td>${esc(x.loop)}</td><td class="n">${auto?`<span id="iv${i}"></span>`:num(x.value,0.1,`data-ii="${i}" aria-label="${esc(x.name)} 현재값"`)}</td><td class="n">${esc(x.op)} ${x.trigger} ${esc(x.unit)}</td><td class="${x.effect}">${x.effect==='up'?'금리 ↑':'금리 ↓'}</td><td id="is${i}"></td><td class="st">${esc(x.note)}</td></tr>`;});
  $('ind').innerHTML=h+'</tbody>';
  $('ind').querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{const v=parseFloat(el.value);D.indicators[+el.dataset.ii].value=isFinite(v)?v:null;save();render();}));
}

/* render */
function render(){
  const {E,sp,ev,hi,lo}=stats(),{m,den}=M(),y=D.market.y10,b=D.base;
  $('meta').textContent=`기준일 ${D.asof} · 10년 ${pct(y)} · 3년 ${pct(D.market.y3)}`;
  const boom=D.market.peak-D.market.pre;
  $('tiles').innerHTML=[
    ['상방 극단',pct(hi),`<span class="up">${bp(hi-y)}</span>`],
    ['확률가중 적정',pct(ev),`<span class="${cls(ev-y)}">${bp(ev-y)}</span>`],
    ['하방 극단',pct(lo),`<span class="down">${bp(lo-y)}</span> · 붐 상승분 ${Math.round((D.market.peak-lo)/boom*100)}% 되돌림`],
    ['반사성 승수',isFinite(m)?m.toFixed(2)+'×':'폭주',`분모 ${den.toFixed(3)}`]
  ].map(t=>`<div class="tile"><span class="k">${t[0]}</span><span class="v">${t[1]}</span><span class="d">${t[2]}</span></div>`).join('');
  E.forEach((e,i)=>{$('r'+i).textContent=bp(e.dr);$('d'+i).innerHTML=`<span class="${cls(e.d)}">${bp(e.d)}</span>`;$('f'+i).innerHTML=`<span class="${cls(e.d)}">${pct(e.fair)}</span>`;$('o'+i).textContent=pct(e.over);});
  $('sp').textContent=sp+(Math.abs(sp-100)>0.5?' ≠100':'');$('evd').innerHTML=`<span class="${cls(ev-y)}">${bp(ev-y)}</span>`;$('ev').textContent=pct(ev);
  const sum=b.pi+b.rs+b.tp+b.at,eps=y-sum,gImp=b.g+eps/b.beta;
  $('compOut').innerHTML=`분해 합 <b>${pct(sum)}</b> · 시장과의 잔차 <b>${bp(eps)}</b> · 가격 내재 잠재성장 <b>${pct(gImp)}</b> · 3y7y 선도 <b>${pct(fwd())}</b>`;
  $('reflOut').innerHTML=`β·φ <b>${(b.beta*D.reflex.phi).toFixed(3)}</b> (성장 고리, 제어) · ψ <b>${D.reflex.psi.toFixed(3)}</b> (공급 고리, 강화) · 전제 10bp 변화 → 금리 <b>${isFinite(m)?(m*10).toFixed(1):'∞'}bp</b>, 오버슈팅 포함 <b>${isFinite(m)?(m*10*(1+D.reflex.kappa/100)).toFixed(1):'∞'}bp</b>`;
  D.indicators.forEach((x,i)=>{let v=x.value;if(v==='auto'){v=fwd()-D.market.y3;$('iv'+i).textContent=v.toFixed(2);}
    const s=$('is'+i);if(v==null||!isFinite(v)){s.innerHTML='<span class="chip na">입력 필요</span>';return;}
    const on={'<':v<x.trigger,'<=':v<=x.trigger,'>':v>x.trigger,'>=':v>=x.trigger}[x.op];
    s.innerHTML=on?'<span class="chip on">발동</span>':'<span class="chip off">대기</span>';});
  renderRange(E,ev);
}
function renderRange(E,ev){
  const box=$('range'),W=Math.max(320,box.clientWidth||700),narrow=W<600,ml=narrow?110:200,mr=56,mt=14,rh=38,n=D.narratives.length,mb=26,H=mt+rh*n+mb,pw=W-ml-mr;
  const y=D.market.y10,vals=[y,D.market.pre,D.market.peak].concat(E.flatMap(e=>[e.fair,e.over]));
  const lo=Math.floor((Math.min(...vals)-0.05)*10)/10,hi=Math.ceil((Math.max(...vals)+0.05)*10)/10,X=v=>ml+(v-lo)/(hi-lo)*pw;
  const st=(hi-lo)>1.6?0.5:0.25;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="내러티브별 10년물 도달 범위">`;
  for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${mt}" y2="${mt+rh*n}" stroke="var(--line)"/><text x="${X(v)}" y="${H-8}" text-anchor="middle">${v.toFixed(2)}</text>`;
  [D.market.pre,D.market.peak].forEach(v=>s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${mt}" y2="${mt+rh*n}" stroke="var(--axis)" stroke-dasharray="2 3"/>`);
  s+=`<line x1="${X(y)}" x2="${X(y)}" y1="${mt}" y2="${mt+rh*n}" stroke="var(--ink)" stroke-width="2"/>`;
  if(isFinite(ev))s+=`<line x1="${X(ev)}" x2="${X(ev)}" y1="${mt}" y2="${mt+rh*n}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  D.narratives.forEach((nr,i)=>{const e=E[i],cy=mt+rh*i+rh/2,col=e.d>0.0049?'var(--up)':e.d<-0.0049?'var(--down)':'var(--ink)';
    const lab=narrow&&nr.name.length>7?nr.name.slice(0,6)+'…':nr.name;
    s+=`<text x="${ml-10}" y="${cy+4}" text-anchor="end" class="lab">${esc(lab)}</text>`;
    s+=`<line x1="${X(y)}" x2="${X(e.over)}" y1="${cy}" y2="${cy}" stroke="${col}" stroke-width="2" stroke-dasharray="3 3" opacity=".7"/>`;
    s+=`<line x1="${X(e.over)}" x2="${X(e.over)}" y1="${cy-6}" y2="${cy+6}" stroke="${col}" stroke-width="2"/>`;
    s+=`<circle cx="${X(e.fair)}" cy="${cy}" r="6" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;
    s+=`<text x="${X(e.fair)}" y="${cy-10}" text-anchor="middle" style="fill:var(--ink)">${e.fair.toFixed(2)}</text>`;
    if(Math.abs(e.over-e.fair)>0.03)s+=`<text x="${e.d<0?X(e.over)-6:X(e.over)+6}" y="${cy+4}" text-anchor="${e.d<0?'end':'start'}">${e.over.toFixed(2)}</text>`;
    s+=`<rect x="0" y="${cy-rh/2}" width="${W}" height="${rh}" fill="transparent" data-i="${i}" class="hit"/>`;});
  box.innerHTML=s+'</svg>';
  const svg=box.querySelector('svg');
  box.querySelectorAll('.hit').forEach(r=>{r.addEventListener('pointermove',ev2=>{const i=+r.dataset.i,e=E[i],nr=D.narratives[i],bb=svg.getBoundingClientRect();
    let t=box.querySelector('.tip');if(!t){t=document.createElement('div');t.className='tip';box.appendChild(t);}t.hidden=false;
    t.innerHTML=`<b>${esc(nr.name)}</b> · ${nr.p}%<div class="r"><span>적정</span><span>${pct(e.fair)}</span></div><div class="r"><span>극단</span><span>${pct(e.over)}</span></div><div class="r"><span>현재 대비</span><span>${bp(e.fair-D.market.y10)}</span></div>`;
    let x=ev2.clientX-bb.left+14;if(x+t.offsetWidth>box.clientWidth)x-=t.offsetWidth+28;t.style.left=Math.max(0,x)+'px';t.style.top=(ev2.clientY-bb.top-10)+'px';});
    r.addEventListener('pointerleave',()=>{const t=box.querySelector('.tip');if(t)t.hidden=true;});});
}

$('copy').addEventListener('click',()=>{const txt=JSON.stringify(D,null,2);
  const ok=()=>{$('msg').textContent='복사했다.';};
  try{navigator.clipboard.writeText(txt).then(ok,()=>{fallback(txt);});}catch(e){fallback(txt);}});
function fallback(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='width:100%;height:160px;margin-top:8px';$('msg').textContent='자동 복사가 막혀 아래 내용을 직접 복사하세요.';$('msg').after(ta);ta.select();}
$('reset').addEventListener('click',()=>{D=JSON.parse(JSON.stringify(DEF));save();init();$('msg').textContent='기본값으로 되돌렸다.';});
function init(){buildNar();buildFields();buildInd();render();}
init();
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>renderRange(stats().E,stats().ev),120);});
})();
</script>
