name: Update yields & deploy
on:
  push:
    branches: [main]
  schedule:
    # 평일 18:10 KST (09:10 UTC), 장 마감·종가 확정 이후
    - cron: '10 9 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 국고채 3년·10년 금리 갱신
        if: github.event_name != 'push'
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          python3 scripts/update_yields.py
          if ! git diff --quiet index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "국고채 금리 자동 갱신 $(TZ=Asia/Seoul date +%F)"
            git push origin HEAD:main
          fi
      - name: gh-pages 배포
        run: git push --force origin HEAD:gh-pages
